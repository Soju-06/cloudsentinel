services:
  cloudsentinel:
    build: .
    image: cloudsentinel:latest
    container_name: cloudsentinel
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      CLOUDSENTINEL_DB: /app/data/sentinel.db
      CLOUDSENTINEL_RAW: /app/data/raw
      CLOUDSENTINEL_REPORTS: /app/reports
      # Secrets should be provided through an .env file or your orchestrator:
      # CLOUDSENTINEL_SLACK_WEBHOOK: https://hooks.slack.com/services/...
      # CLOUDSENTINEL_SMTP_PASSWORD: ...
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
