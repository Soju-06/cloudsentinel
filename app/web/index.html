<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CloudSentinel — cloud security monitoring and threat detection console.">
  <meta name="theme-color" content="#050810">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CloudSentinel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>CloudSentinel</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050810;
      overflow: hidden;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 45%, #0d1b30 0%, #050810 65%);
      font-family: Consolas, "Courier New", monospace;
      color: #00e5ff;
      letter-spacing: 4px;
      transition: opacity 240ms ease;
    }
    #boot .ring {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(0, 229, 255, 0.25);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }
    #boot .name { font-size: 13px; font-weight: 700; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="ring"></div>
    <div class="name">CLOUDSENTINEL</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the HTML boot screen once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 260);
    });
  </script>
</body>
</html>
