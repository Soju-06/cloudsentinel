[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentinel"
version = "0.6.0"
description = "Cloud security monitoring and threat detection lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "fpdf2>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
cloudsentinel = "cloudsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["cloudsentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
